apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: roboshop-qa
  namespace: argocd

spec:

  # ============================================================
  # Allowed Git repositories
  # ============================================================
  sourceRepos:
    - https://github.com/vaheed-valaxy/roboshop-gitops.git

  # ============================================================
  # Allowed destinations
  # ============================================================
  destinations:
    - server: https://kubernetes.default.svc
      namespace: roboshop-qa

  # ============================================================
  # Cluster-wide resources this AppProject can manage
  # ============================================================
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

    - group: "rbac.authorization.k8s.io"
      kind: Role

    - group: "rbac.authorization.k8s.io"
      kind: RoleBinding

  # ============================================================
  # Namespace-scoped resources this AppProject can manage
  # ============================================================
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  # ============================================================
  # AppProject role for GitHub Actions
  # ============================================================
  roles:

    - name: roboshop-gh-actions-qa
      description: GitHub Actions role for syncing roboshop QA applications.
      
      policies:

        # Allow GitHub Actions to read the QA applications
        - p, proj:roboshop-qa:roboshop-gh-actions-qa, applications, get, roboshop-qa/*, allow 

        # Allow GitHub Actions to sync the QA applications
        - p, proj:roboshop-qa:roboshop-gh-actions-qa, applications, sync, roboshop-qa/*, allow
          

  # ============================================================
  # Description
  # ============================================================
  description: >
    Single AppProject for qa environment of roboshop application.
    Provides GitOps permissions and allows automated namespace creation.
