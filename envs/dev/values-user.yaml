# ===================================================
#                    USER
# ===================================================

# namespace: roboshop-dev

# ---------------------------------------------------
# Container
# ---------------------------------------------------
image:
  ecr_registry: 254405569649.dkr.ecr.us-east-1.amazonaws.com
  ecr_repository: roboshop-dev/user
  docker_registry: docker.io
  docker_repository: joindevops/user
  tag: 4.0.0
  digest: sha256:a5c6e8120a55cc2f541421a56847c9bfd1bcc485b711234f514c776f6ac8ff34
containerName: user
imagePullPolicy: Always
terminationGracePeriodSeconds: 30
# ---------------------------------------------------
# Labels
# ---------------------------------------------------
labels:
  app.kubernetes.io/name: roboshop
  app.kubernetes.io/component: user
  app.kubernetes.io/env: dev
  app.kubernetes.io/version: 1.0.0
# ---------------------------------------------------
# Deployment
# ---------------------------------------------------
deployment:
  name: user-deploy
  replicas: 1
# ---------------------------------------------------
# Service
# ---------------------------------------------------
service:
  name: user-svc
  type: ClusterIP
  port: 8080
  targetPort: 8080
# ---------------------------------------------------
# Pod Annotations
# ---------------------------------------------------
annotations:
  enabled: true
  enable_checksum: true
  checksum_file: configmap.yaml
  values:
    reloader.stakater.com/auto: "true"
# ---------------------------------------------------
# Security Context
# ---------------------------------------------------
podSecurityContext:
  enabled: true
  values:
    fsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000
containerSecurityContext:
  enabled: true
  values:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
# ---------------------------------------------------
# Configmaps & Secrets
# ---------------------------------------------------
configmap:
  enabled: true
  name: user-configmap
  values:
    MONGO: "true"
    REDIS_URL: "redis://redis-svc:6379"
    MONGO_URL: "mongodb://mongodb-svc:27017/users"
secret:
  create: false # Creates through ESO 
  name: roboshop-dev-postgre-jwt-credentials
     
envFrom:
  enabled: true
  values:
    - configMapRef:
        name: user-configmap
    # - secretRef:
    #     name: roboshop-dev-postgre-jwt-credentials # Creates through ESO   
# ---------------------------------------------------
# Limits & Requests
# ---------------------------------------------------
resources:
  enabled: true
  values:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
# ---------------------------------------------------
# Healthcheck Probes
# ---------------------------------------------------
startupProbe:
  enabled: true
  values:
    httpGet:
      path: /
      port: 8080
    failureThreshold: 10
    periodSeconds: 10
readinessProbe:
  enabled: true
  values:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 10
livenessProbe:
  enabled: true
  values:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 20
    periodSeconds: 30
# ---------------------------------------------------
# Autoscaling
# ---------------------------------------------------
autoscaling:
  enabled: false
  values:
    name: user-hpa
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
# ---------------------------------------------------
# Service Account
# ---------------------------------------------------
serviceAccount:
  create: false
  values:
    name: user-sa
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::254405569649:role/roboshop-dev-user-role"
# ---------------------------------------------------
# Target Group Binding
# ---------------------------------------------------
targetGroupBinding:
  enabled: false
  values:
    name: roboshop-dev-user-tgb
    targetType: "ip"
    targetGroupName: roboshop-dev-user-tg
    # targetGroupARN: "REPLACE_WITH_TERRAFORM_OUTPUT"
# ---------------------------------------------------
# Node Selectors
# ---------------------------------------------------
nodeSelector:
  enabled: true
  values:
    workload: application
# ---------------------------------------------------
# Tolerations
# ---------------------------------------------------
tolerations:
  enabled: true
  values:
    - key: dedicated
      operator: Equal
      value: application
      effect: NoSchedule
